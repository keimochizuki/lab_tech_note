<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">

<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link rel="preload" href="https://fonts.googleapis.com/css?family=Open+Sans:400,700&display=swap" as="style" type="text/css" crossorigin>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#157878">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
<style type="text/css">
img.cc {
  max-width: 1em;
  max-height: 1em;
  margin-left: .2em;
  margin-bottom: -.1em;
}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  if (!window.mermaid) return;
  document.querySelectorAll("code.language-mermaid").forEach(code => {
    const pre = code.parentElement;
    const div = document.createElement("div");
    div.className = "mermaid";
    div.textContent = code.textContent;
    pre.replaceWith(div);
  });
  mermaid.initialize({ startOnLoad: false });
  mermaid.run();
});
</script>
</head>

<body>
<main id="content" class="main-content" role="main">
{{ content }}

<footer class="site-footer">
{% if site.github.is_project_page %}
  <span class="site-footer-owner"><a href="{{ site.github.repository_url }}">{{ site.github.repository_name }}</a> is maintained by <a href="{{ site.github.owner_url }}">{{ site.github.owner_name }}</a>.</span>
{% endif %}
<span class="site-footer-credits">
This article is published under Creative Commons license
(<a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a><img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="" class="cc"><img src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt="" class="cc"><img src="https://mirrors.creativecommons.org/presskit/icons/nc.svg" alt="" class="cc"><img src="https://mirrors.creativecommons.org/presskit/icons/sa.svg" alt="" class="cc">).<br>
This page was generated by <a href="https://pages.github.com">GitHub Pages</a>.
</span>
</footer>

</main>
</body>

</html>
